<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fillcard</title>
<meta name="description" content="Lash maps, client records and refill cards for lash artists. Free, private, works on any phone.">
<meta name="theme-color" content="#FFF8F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1622" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fillcard">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,500..700,0..100,0..1;1,9..144,500..700,0..100,0..1&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8F1; --surface:#FFFFFF; --surface-2:#FFF1E6; --ink:#3A2A2E; --ink-2:#6A5458; --muted:#9A8588; --line:#F1E3D9;
  --accent:#D9577A; --accent-ink:#FFFFFF; --gold:#F2B84B;
  --peach:#FFE3D4; --blush:#FFDCE6; --lilac:#ECE4FF; --butter:#FFF2C4; --sage:#DFF1E1; --sky:#DCEEFF;
  --ok:#2F8F5B; --warn:#B8700E; --bad:#D2453F;
  --edge:rgba(58,42,46,.11); --lift:0 5px 0 rgba(58,42,46,.07); --lift-2:0 8px 0 rgba(58,42,46,.08),0 22px 34px -20px rgba(110,40,70,.38);
  --glass:rgba(255,250,245,.84); --grain-op:.55; --grain-blend:multiply;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1C1622; --surface:#272030; --surface-2:#30283A; --ink:#F6EDF1; --ink-2:#DCCFD6; --muted:#A895A3; --line:#3A3044;
    --peach:#46302F; --blush:#4A2C3B; --lilac:#352D52; --butter:#433D22; --sage:#24402F; --sky:#233A52;
    --ok:#7FD3A2; --warn:#F0BE68; --bad:#FF8F86; --gold:#F5C969;
    --edge:rgba(255,255,255,.08); --lift:0 5px 0 rgba(0,0,0,.35); --lift-2:0 8px 0 rgba(0,0,0,.4),0 22px 34px -20px rgba(0,0,0,.7);
    --glass:rgba(39,32,48,.86); --grain-op:.25; --grain-blend:screen;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1622; --surface:#272030; --surface-2:#30283A; --ink:#F6EDF1; --ink-2:#DCCFD6; --muted:#A895A3; --line:#3A3044;
  --peach:#46302F; --blush:#4A2C3B; --lilac:#352D52; --butter:#433D22; --sage:#24402F; --sky:#233A52;
  --ok:#7FD3A2; --warn:#F0BE68; --bad:#FF8F86; --gold:#F5C969;
  --edge:rgba(255,255,255,.08); --lift:0 5px 0 rgba(0,0,0,.35); --lift-2:0 8px 0 rgba(0,0,0,.4),0 22px 34px -20px rgba(0,0,0,.7);
  --glass:rgba(39,32,48,.86); --grain-op:.25; --grain-blend:screen;
  color-scheme:dark;
}
:root{
  --soft:color-mix(in srgb,var(--accent) 16%,var(--surface));
  --accent-deep:color-mix(in srgb,var(--accent) 70%,#2a0d18);
  --ok-soft:color-mix(in srgb,var(--ok) 15%,var(--surface)); --warn-soft:color-mix(in srgb,var(--warn) 17%,var(--surface)); --bad-soft:color-mix(in srgb,var(--bad) 14%,var(--surface));
  --r:28px; --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --serif:"Fraunces",ui-serif,Georgia,serif; --sans:"Nunito",ui-rounded,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --wavy:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='8' viewBox='0 0 24 8'><path d='M0 4 Q6 0 12 4 T24 4' fill='none' stroke='black' stroke-width='2.4' stroke-linecap='round'/></svg>");
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:
    radial-gradient(520px 380px at 108% -4%,color-mix(in srgb,var(--blush) 90%,transparent),transparent 70%),
    radial-gradient(480px 420px at -18% 42%,color-mix(in srgb,var(--lilac) 75%,transparent),transparent 70%),
    radial-gradient(520px 420px at 110% 96%,color-mix(in srgb,var(--butter) 70%,transparent),transparent 70%),var(--bg);
  background-attachment:fixed;color:var(--ink);font:500 15.5px/1.45 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;
  padding-bottom:calc(116px + env(safe-area-inset-bottom));font-variant-numeric:tabular-nums;
}
/* paper grain over everything, never blocks taps */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:90;opacity:var(--grain-op);mix-blend-mode:var(--grain-blend);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .25 0 0 0 0 .17 0 0 0 0 .19 0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
body.focus,body.client-mode{padding-bottom:0}
body.focus .tabbar,body.focus .top,body.client-mode .tabbar,body.client-mode .top{display:none}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
.ic{flex:none;display:block}

/* motion */
@keyframes viewIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes lashGrow{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.12;transform:scale(1.3)}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetDown{to{transform:translateY(100%)}}
@keyframes popIn{0%{opacity:0;transform:scale(.5) rotate(-6deg)}100%{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:perspective(900px) rotateX(16deg) rotate(-3deg) translateY(34px) scale(.92)}to{opacity:1;transform:rotate(-1deg)}}
@keyframes slideL{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@keyframes hand{0%,100%{transform:translateY(5px)}50%{transform:translateY(-9px)}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-4px) scale(1.025,.975)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
@keyframes morph{0%,100%{border-radius:46% 54% 52% 48%/55% 45% 55% 45%}50%{border-radius:55% 45% 44% 56%/46% 56% 44% 54%}}
@keyframes wiggle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.view{animation:viewIn .42s var(--ease) both}
.rise{animation:rise .6s var(--spring) both;animation-delay:calc(var(--i,0) * 55ms)}
.press{transition:transform .18s var(--ease),box-shadow .18s,background-color .2s,border-color .2s}
.press:active{transform:translateY(3px) scale(.98)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* mascot + scenes */
.mascot{display:block;overflow:visible}
.mascot .bob{animation:bob 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.mascot .blink{animation:blink 4.6s infinite;transform-box:fill-box;transform-origin:center}
.mascot .tw{animation:twinkle 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.scene{position:relative;border-radius:32px;overflow:hidden;border:2px solid var(--edge);box-shadow:var(--lift-2);color:#3A2A2E;isolation:isolate}
.scene>svg.bg{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.scene .cloud{animation:drift 9s ease-in-out infinite alternate}
.scene .cloud.c2{animation-duration:12s;animation-delay:-4s}
.scene .tw{animation:twinkle 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.scene .content{position:relative;padding:18px 18px 16px}
.scene .eyebrow{color:rgba(58,42,46,.65)}
.bubble{position:relative;display:inline-block;background:#fff;color:#3A2A2E;border:2px solid rgba(58,42,46,.12);border-radius:18px;padding:7px 12px;font:800 13px/1.25 var(--sans);box-shadow:0 4px 0 rgba(58,42,46,.1);animation:popIn .55s var(--spring) .35s both;max-width:200px}
.bubble::after{content:"";position:absolute;left:26px;bottom:-9px;width:14px;height:14px;background:#fff;border-right:2px solid rgba(58,42,46,.12);border-bottom:2px solid rgba(58,42,46,.12);transform:rotate(45deg);border-bottom-right-radius:4px}
.hero-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:end}
.hero-grid .who{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.hero-grid .big{font:700 46px/1 var(--serif);font-variation-settings:"SOFT" 100,"WONK" 1;letter-spacing:-.02em;margin:2px 0}
.hero-grid p{margin:0;font-weight:700;color:rgba(58,42,46,.75);font-size:14px}
.hero-grid .bubble{max-width:150px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

/* chrome */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3)}
.top .wrap{display:flex;align-items:center;gap:10px;height:60px}
.brand{font:700 23px/1 var(--serif);font-variation-settings:"SOFT" 100,"WONK" 1;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.brand .mascot{width:36px;height:36px}
.spacer{flex:1}
.iconbtn{appearance:none;border:2px solid var(--edge);background:var(--surface);width:44px;height:44px;border-radius:16px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);box-shadow:var(--lift)}
.tabbar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:6;max-width:520px;margin:0 auto;background:var(--glass);
  backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:2px solid var(--edge);border-radius:30px;box-shadow:var(--lift-2);display:grid;grid-template-columns:repeat(4,1fr);height:70px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:800;color:var(--muted);text-decoration:none;position:relative;transition:color .2s}
.tab svg{transition:transform .35s var(--spring)}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg{transform:translateY(-2px) scale(1.12)}
.tab.fab{color:var(--ink-2)}
.tab.fab .dot{width:58px;height:58px;background:var(--accent);color:#fff;display:grid;place-items:center;transform:translateY(-18px);border:3px solid var(--surface);
  box-shadow:0 5px 0 var(--accent-deep),0 14px 24px -10px color-mix(in srgb,var(--accent) 80%,transparent);animation:morph 6s ease-in-out infinite;transition:transform .25s var(--spring)}
.tab.fab:active .dot{transform:translateY(-15px) scale(.92)}
.tab.fab span.lbl{margin-top:-15px}

/* type */
h1{font:700 32px/1.08 var(--serif);font-variation-settings:"SOFT" 100,"WONK" 1;letter-spacing:-.02em;margin:18px 0 6px}
h1 em{font-style:italic;font-weight:600;color:var(--accent);text-decoration:underline wavy color-mix(in srgb,var(--accent) 45%,transparent);text-decoration-thickness:2.5px;text-underline-offset:7px;text-decoration-skip-ink:none}

h2{font:700 20px/1.2 var(--serif);font-variation-settings:"SOFT" 100,"WONK" 1;margin:0 0 10px}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h3.eyebrow{margin:26px 4px 10px;display:flex;align-items:center;gap:8px;color:var(--ink-2)}
h3.eyebrow .doodle{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:var(--surface);border:2px solid var(--edge);color:var(--accent);transform:rotate(-6deg)}
h3.eyebrow .count{background:var(--ink);color:var(--bg);border-radius:999px;padding:1px 9px;font-size:11px;letter-spacing:0}
.sub{color:var(--muted);margin:0 0 16px;font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px} .grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px} .row.wrapr{flex-wrap:wrap}

/* surfaces */
.card{background:var(--surface);border:2px solid var(--edge);border-radius:var(--r);box-shadow:var(--lift);padding:18px;margin:0 0 14px}
.card.tight{padding:6px 14px}
.t-peach{background:var(--peach)!important}.t-butter{background:var(--butter)!important}.t-lilac{background:var(--lilac)!important}.t-sage{background:var(--sage)!important}.t-sky{background:var(--sky)!important}.t-blush{background:var(--blush)!important}
.btn{appearance:none;border:2px solid var(--edge);background:var(--surface);border-radius:18px;padding:11px 16px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;text-decoration:none;color:var(--ink);white-space:nowrap;line-height:1.15;box-shadow:0 4px 0 var(--edge)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.btn.primary{background:var(--accent);border-color:var(--accent-deep);color:#fff;box-shadow:0 5px 0 var(--accent-deep)}
.btn.primary:active{box-shadow:0 2px 0 var(--accent-deep)}
.btn.white{background:#fff;color:#3A2A2E;border-color:rgba(58,42,46,.14);box-shadow:0 4px 0 rgba(58,42,46,.16)}
.btn.glass{background:rgba(255,255,255,.6);color:#3A2A2E;border-color:rgba(58,42,46,.14);box-shadow:0 4px 0 rgba(58,42,46,.1)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn.sm{min-height:38px;padding:7px 12px;font-size:13px;border-radius:14px}
.btn.block{width:100%}
.btn.danger{color:var(--bad)}
.btn.lg{min-height:58px;font-size:16.5px;border-radius:20px}
.btn:disabled{opacity:.45;pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>.btn{white-space:normal;text-align:center}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.grid3.fields{grid-template-columns:1fr 1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:2px solid var(--edge);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:800;cursor:pointer;min-height:40px;transition:all .25s var(--spring);color:var(--ink-2);box-shadow:0 3px 0 var(--edge)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);transform:translateY(-1px) rotate(-1.5deg);box-shadow:0 3px 0 color-mix(in srgb,var(--ink) 50%,transparent)}
.seg{display:flex;background:var(--surface-2);border:2px solid var(--edge);border-radius:20px;padding:4px;gap:4px}
.seg button{flex:1;appearance:none;border:0;background:transparent;border-radius:14px;padding:9px 6px;font-weight:800;font-size:13px;cursor:pointer;min-height:40px;color:var(--muted);transition:all .28s var(--spring)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 3px 0 var(--edge),0 0 0 2px var(--edge)}
.field{display:block;margin:0 0 12px}
.field>span{display:block;font-size:12.5px;font-weight:800;margin:0 0 6px;color:var(--ink-2)}
.field .hint{font-weight:600;color:var(--muted)}
input[type=text],input[type=tel],input[type=url],input[type=date],input[type=number],input[type=search],input[type=email],input[type=time],select,textarea{width:100%;background:var(--surface);border:2px solid var(--edge);border-radius:16px;padding:12px 13px;min-height:50px;outline:none;transition:border-color .2s,box-shadow .2s;font-weight:600}
textarea{min-height:90px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.search{position:relative}.search .ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:44px;border-radius:20px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 6px}
.stat{background:var(--surface);border:2px solid var(--edge);border-radius:22px;padding:13px 12px;box-shadow:var(--lift)}
.stats .stat:nth-child(1){background:var(--peach)}.stats .stat:nth-child(2){background:var(--butter)}.stats .stat:nth-child(3){background:var(--lilac)}.stats .stat:nth-child(4){background:var(--sage)}
.stat b{display:block;font:700 26px/1.05 var(--serif);font-variation-settings:"SOFT" 100,"WONK" 1}
.stat span{font-size:12px;color:var(--ink-2);font-weight:700}
.stats.four{grid-template-columns:repeat(2,1fr)}
@media (min-width:560px){.stats.four{grid-template-columns:repeat(4,1fr)}}

/* lists */
.item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:2px dashed var(--edge);text-decoration:none;color:inherit;border-radius:14px}
.item:first-child{border-top:0}
.item a{text-decoration:none}
.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--surface);color:var(--ink-2);white-space:nowrap;border:1.5px solid var(--edge)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.accent{background:var(--soft);color:var(--accent)}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.ava{position:relative;display:grid;place-items:center;flex:none;text-decoration:none}
.ava svg{position:absolute;inset:0;width:100%;height:100%}
.ava .trk{fill:none;stroke:var(--edge);stroke-width:3}
.ava .prg{fill:none;stroke-width:3.2;stroke-linecap:round;transition:stroke-dashoffset 1.2s var(--ease)}
.ava b{position:relative;width:calc(100% - 11px);height:calc(100% - 11px);background:var(--tint,var(--soft));color:var(--ink);display:grid;place-items:center;font-weight:800;letter-spacing:.02em;border-radius:46% 54% 52% 48%/55% 45% 55% 45%;border:2px solid var(--edge)}
.qbtn{appearance:none;border:2px solid var(--edge);background:var(--surface);color:var(--accent);width:42px;height:42px;border-radius:15px;display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:0 3px 0 var(--edge)}
.qbtn:active{transform:translateY(2px);box-shadow:none}
.qbtn.done{background:var(--ok-soft);color:var(--ok)}
.empty{text-align:center;padding:16px 10px 20px;color:var(--ink-2);font-weight:700}
.empty .mascot{margin:0 auto 6px}

/* lash map */
.map{width:100%;height:auto;display:block;overflow:visible}
.map .lid{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round}
.map .lower{fill:none;stroke:color-mix(in srgb,var(--ink) 25%,transparent);stroke-width:2;stroke-dasharray:3 6;stroke-linecap:round}
.map .lash{fill:none;stroke-linecap:round;transition:opacity .25s}
.map .zonehit{fill:transparent}
.map [data-zone]{cursor:ns-resize;touch-action:none}
.map .lbl circle.c{fill:var(--surface);stroke:var(--ink);stroke-width:1.6;transition:fill .2s}
.map .lbl text{font:800 11px var(--sans);fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.map .lbl.sel circle.c{fill:var(--accent);stroke:var(--accent-deep)}
.map .lbl.sel text{fill:#fff}
.map .halo{fill:var(--accent);opacity:.3;transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-in-out infinite}
.map .cap{font:800 9.5px var(--sans);fill:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.map.grow .lash{stroke-dasharray:1;stroke-dashoffset:1;animation:lashGrow .75s var(--ease) forwards;animation-delay:calc(var(--d) * 9ms)}
.map.grow .lbl{opacity:0;animation:popIn .5s var(--spring) forwards;animation-delay:calc(.35s + var(--d) * 45ms)}
.mapwrap{position:relative;background:radial-gradient(60% 75% at 50% 72%,var(--blush),transparent 72%);border-radius:22px;margin:2px -4px 0}
.maphint{position:absolute;left:0;right:0;margin:0 auto;width:max-content;top:6px;display:flex;align-items:center;gap:6px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:800;padding:6px 12px;border-radius:999px;white-space:nowrap;animation:popIn .5s var(--spring) .9s both;pointer-events:none;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.maphint .ic{animation:hand 1.4s ease-in-out infinite}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:6px;font-weight:700}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1.5px solid var(--edge)}
.zones{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-top:12px}
.zonebtn{min-width:0;appearance:none;border:2px solid var(--edge);background:var(--surface);border-radius:18px;padding:7px 2px;cursor:pointer;text-align:center;min-height:58px;transition:all .25s var(--spring);box-shadow:0 3px 0 var(--edge)}
.zonebtn b{display:block;font:700 18px/1.1 var(--serif)}
.zonebtn small{font-size:10.5px;font-weight:800;display:inline-flex;align-items:center;gap:3px;color:var(--muted)}
.zonebtn small i{width:6px;height:6px;border-radius:50%}
.zonebtn[aria-pressed="true"]{border-color:var(--accent-deep);background:var(--accent);color:#fff;transform:translateY(-4px) rotate(-2deg);box-shadow:0 5px 0 var(--accent-deep)}
.zonebtn[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.stepper{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:2px solid var(--edge);border-radius:20px;padding:4px}
.stepper button{appearance:none;border:2px solid var(--edge);background:var(--surface);width:44px;height:44px;border-radius:14px;font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--edge);display:grid;place-items:center;color:var(--ink)}
.stepper button:active{transform:translateY(2px);box-shadow:none}
.stepper output{min-width:70px;text-align:center;font:700 23px var(--serif)}
.curls{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
@media (max-width:400px){.curls{grid-template-columns:repeat(4,1fr)}}
.curl{appearance:none;border:2px solid var(--edge);background:var(--surface);border-radius:16px;padding:6px 0 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:800;font-size:12px;transition:all .25s var(--spring);box-shadow:0 3px 0 var(--edge)}
.curl svg{width:24px;height:24px}
.curl[aria-pressed="true"]{border-color:currentColor;background:color-mix(in srgb,currentColor 14%,var(--surface));transform:translateY(-3px) rotate(-3deg)}
.presets{display:flex;gap:10px;overflow-x:auto;padding:4px 16px 12px;margin:0 -16px;scroll-snap-type:x mandatory;scrollbar-width:none}
.presets::-webkit-scrollbar{display:none}
.preset{flex:0 0 116px;scroll-snap-align:start;appearance:none;border:2px solid var(--edge);background:var(--surface);border-radius:22px;padding:8px 8px 9px;cursor:pointer;text-align:center;font-weight:800;font-size:12.5px;transition:all .28s var(--spring);box-shadow:0 4px 0 var(--edge)}
.preset:nth-child(6n+1){background:var(--peach)}.preset:nth-child(6n+2){background:var(--lilac)}.preset:nth-child(6n+3){background:var(--butter)}.preset:nth-child(6n+4){background:var(--sage)}.preset:nth-child(6n+5){background:var(--sky)}.preset:nth-child(6n){background:var(--blush)}
.preset .map{margin:-4px 0 2px}
.preset[aria-pressed="true"]{border-color:var(--ink);transform:translateY(-3px) rotate(-2deg);box-shadow:0 5px 0 var(--ink)}
details.more summary{cursor:pointer;font-size:13px;font-weight:800;color:var(--muted);list-style:none;padding:8px 0;display:flex;align-items:center;gap:4px}
details.more summary::-webkit-details-marker{display:none}

/* wizard */
.wiz-head{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:10px 16px 12px;margin:0 -16px 8px}
.wiz-title{font:700 19px/1.2 var(--serif);font-variation-settings:"SOFT" 100,"WONK" 1;text-align:center}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.steps button{appearance:none;border:0;background:none;padding:0;cursor:pointer;text-align:left;color:var(--muted);font-size:11.5px;font-weight:800;letter-spacing:.03em}
.steps button .bar{display:block;height:9px;border-radius:9px;background:var(--surface-2);border:2px solid var(--edge);margin-bottom:6px;overflow:hidden}
.steps button .bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--accent) 0 8px,color-mix(in srgb,var(--accent) 80%,#fff) 8px 16px);border-radius:9px;transition:width .5s var(--spring)}
.steps button.done .bar i,.steps button.on .bar i{width:100%}
.steps button.on{color:var(--ink)}
.stepbody.fwd{animation:slideL .42s var(--ease) both}.stepbody.back{animation:slideR .42s var(--ease) both}
.wiz-foot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:2px solid var(--edge);padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
.wiz-foot .wrap{display:flex;gap:10px;padding:0}
.wiz-pad{height:116px}
.flag{background:var(--bad-soft);color:var(--bad);border:2px solid color-mix(in srgb,var(--bad) 25%,transparent);border-radius:20px;padding:11px 13px;font-size:13.5px;font-weight:700;margin:0 0 12px;display:flex;gap:8px;align-items:center}
.note{background:var(--lilac);border:2px solid var(--edge);border-radius:20px;padding:11px 13px;font-size:13.5px;font-weight:600;margin:0 0 12px;display:flex;gap:9px;align-items:center;color:var(--ink-2)}
.note .ic{color:var(--accent)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo{aspect-ratio:4/5;border:2px dashed color-mix(in srgb,var(--ink) 22%,transparent);border-radius:22px;display:grid;place-items:center;overflow:hidden;position:relative;cursor:pointer;background:var(--surface-2);color:var(--ink-2);font-size:13px;font-weight:800;text-align:center}
.photo .ph{display:flex;flex-direction:column;align-items:center;gap:6px}
.photo img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;animation:fadeIn .4s ease}
.photo input{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo .tag{position:absolute;left:10px;top:10px;z-index:1;background:#fff;color:#3A2A2E;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;text-transform:capitalize;border:2px solid rgba(58,42,46,.12);transform:rotate(-3deg)}
.range input{width:100%;-webkit-appearance:none;appearance:none;height:12px;border-radius:12px;background:linear-gradient(90deg,var(--accent) var(--v,50%),var(--surface-2) var(--v,50%));border:2px solid var(--edge);outline:none}
.range input::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 3px 0 var(--accent-deep)}
.range input::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.retval{font:700 40px/1 var(--serif);font-variation-settings:"SOFT" 100,"WONK" 1;text-align:center;margin:6px 0 12px}
.retval small{display:block;font:800 12.5px var(--sans);color:var(--muted);margin-top:6px}
.duebox{display:flex;align-items:center;gap:14px;background:var(--butter);border:2px solid var(--edge);border-radius:22px;padding:12px 14px;margin-top:12px}
.calchip{width:56px;flex:none;border-radius:15px;overflow:hidden;background:var(--surface);border:2px solid var(--edge);box-shadow:0 3px 0 var(--edge);text-align:center;transform:rotate(-4deg)}
.calchip span{display:block;background:var(--accent);color:#fff;font-size:10px;font-weight:800;letter-spacing:.08em;padding:3px 0}
.calchip b{display:block;font:700 23px/1.4 var(--serif)}

/* client page */
.prof{display:flex;flex-direction:column;align-items:center;text-align:center;margin:8px 0 14px}
.prof h1{margin:10px 0 8px}
.qa{display:flex;justify-content:center;gap:10px;margin:4px 0 16px;flex-wrap:wrap}
.qa a,.qa button{appearance:none;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:800;color:var(--ink-2);text-decoration:none;min-width:58px}
.qa .qi{width:50px;height:50px;border-radius:18px;background:var(--surface);border:2px solid var(--edge);display:grid;place-items:center;color:var(--accent);box-shadow:0 4px 0 var(--edge);transition:transform .25s var(--spring)}
.qa a:nth-child(5n+1) .qi{background:var(--peach)}.qa a:nth-child(5n+2) .qi,.qa button:nth-child(5n+2) .qi{background:var(--butter)}.qa :nth-child(5n+3) .qi{background:var(--sky)}.qa :nth-child(5n+4) .qi{background:var(--lilac)}.qa :nth-child(5n) .qi{background:var(--sage)}
.qa a:active .qi,.qa button:active .qi{transform:translateY(3px) scale(.94)}
.chart{width:100%;height:auto;display:block}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:3}
.chart .pl{font:800 10px var(--sans);fill:var(--ink-2);text-anchor:middle}
.chart .ref{stroke:color-mix(in srgb,var(--ink) 25%,transparent);stroke-dasharray:3 5}
.timeline{position:relative;padding-left:20px}
.timeline::before{content:"";position:absolute;left:6px;top:10px;bottom:10px;width:3px;border-radius:3px;background:repeating-linear-gradient(to bottom,var(--edge) 0 6px,transparent 6px 11px)}
.tl{position:relative;display:flex;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--edge);border-radius:22px;padding:10px 12px;margin:0 0 10px;text-decoration:none;color:inherit;box-shadow:var(--lift)}
.tl::before{content:"";position:absolute;left:-21px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.tl .mini{width:86px;flex:none;background:var(--blush);border-radius:14px;padding:2px}

/* card screen */
.cardprev{width:100%;height:auto;border-radius:24px;display:block;box-shadow:var(--lift-2);animation:cardIn .9s var(--spring) both;background:var(--surface-2);border:2px solid var(--edge)}
.skeleton{aspect-ratio:4/5;border-radius:24px;background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kv div{background:var(--surface-2);border:2px solid var(--edge);border-radius:16px;padding:10px 12px}
.kv span{display:block;font-size:10.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.kv b{font-weight:800;font-size:14px}

/* sheet */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:88vh;margin:auto auto 0;border-radius:32px 32px 0 0;border-top:2px solid var(--edge);box-shadow:0 -20px 60px -20px rgba(0,0,0,.35);animation:sheetUp .45s var(--spring)}
dialog.closing{animation:sheetDown .22s ease-in forwards}
dialog::backdrop{background:rgba(40,20,30,.4);backdrop-filter:blur(4px);animation:fadeIn .3s ease}
@media (min-width:700px){dialog{margin:auto;border-radius:32px;border:2px solid var(--edge)}}
.grab{width:44px;height:6px;border-radius:6px;background:var(--line);margin:10px auto 0}
dialog .dhead{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 0}
dialog .dhead h2{margin:0}
dialog .dbody{padding:14px 18px calc(22px + env(safe-area-inset-bottom));overflow:auto}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{appearance:none;width:42px;height:42px;border-radius:46% 54% 52% 48%/55% 45% 55% 45%;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--edge),0 3px 0 2px var(--edge);cursor:pointer;transition:transform .25s var(--spring)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink);transform:scale(1.12) rotate(-8deg)}

/* toast + confetti */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-24px) scale(.9);background:var(--surface);color:var(--ink);border:2px solid var(--edge);padding:8px 16px 8px 8px;border-radius:20px;font-weight:800;font-size:14px;opacity:0;transition:all .4s var(--spring);z-index:95;pointer-events:none;max-width:calc(100% - 32px);display:flex;gap:9px;align-items:center;box-shadow:var(--lift-2)}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.toast .mascot{width:34px;height:34px}
.spark{position:fixed;pointer-events:none;z-index:96}

/* welcome */
.welcome{display:flex;flex-direction:column;padding:20px 0 40px}
.welcome .scene .content{display:flex;flex-direction:column;align-items:center;padding:22px 16px 10px}
.welcome h1{font-size:38px;margin:26px 0 10px}
.feat{display:flex;gap:12px;align-items:flex-start;margin:12px 0;background:var(--surface);border:2px solid var(--edge);border-radius:22px;padding:12px;box-shadow:var(--lift)}
.feat .qi{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;flex:none;color:var(--ink);border:2px solid var(--edge);transform:rotate(-5deg)}
.feat:nth-of-type(1) .qi{background:var(--peach)}.feat:nth-of-type(2) .qi{background:var(--lilac)}.feat:nth-of-type(3) .qi{background:var(--sage)}
.feat b{display:block;font-weight:800}

/* client passport */
.pp{max-width:520px;margin:0 auto;padding:16px 16px 124px}
.pp .scene .content{text-align:center;padding:16px 16px 72px}
.pp .scene h1{color:#3A2A2E;margin:8px 0 4px;font-size:31px}
.pp .scene .mascot{margin:6px auto 0}
.ringcard{margin:-60px 14px 14px;text-align:center;position:relative;z-index:1;padding:20px 16px}
.bigring{width:168px;height:168px;margin:0 auto;position:relative;display:grid;place-items:center}
.bigring svg{position:absolute;inset:0}
.bigring .trk{fill:none;stroke:var(--surface-2);stroke-width:14}
.bigring .prg{fill:none;stroke:url(#rg2);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset 1.5s var(--ease)}
.bigring b{font:700 52px/1 var(--serif);font-variation-settings:"SOFT" 100,"WONK" 1;display:block}
.bigring span{display:block;max-width:112px;margin:4px auto 0;line-height:1.25;font-size:12px;color:var(--muted);font-weight:800}
.after{list-style:none;padding:0;margin:0}
.after li{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:2px dashed var(--edge);cursor:pointer;user-select:none;font-weight:600}
.after li:first-child{border-top:0}
.after .cb{width:26px;height:26px;border-radius:9px;border:2px solid color-mix(in srgb,var(--ink) 25%,transparent);display:grid;place-items:center;flex:none;transition:all .3s var(--spring);color:transparent;background:var(--surface)}
.after li.on .cb{background:var(--accent);border-color:var(--accent-deep);color:#fff;transform:scale(1.1) rotate(-8deg)}
.after li.on span{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}
.ppbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:2px solid var(--edge);padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
.ppbar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.foot{text-align:center;color:var(--muted);font-size:12px;font-weight:700;margin-top:20px}
[hidden]{display:none!important}
/* consent */
.cq{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:2px dashed var(--edge)}
.cq:first-of-type{border-top:0}
.cq>div:first-child{flex:1;font-size:14px;font-weight:700}
.seg.yn{flex:0 0 120px}
.consent-text{white-space:pre-wrap;font-size:13.5px;line-height:1.55;background:var(--surface-2);border:2px solid var(--edge);border-radius:18px;padding:12px 14px;max-height:240px;overflow:auto;color:var(--ink-2);font-weight:600}
.agree{display:flex;gap:10px;align-items:center;margin-top:12px;font-weight:800;font-size:14px;cursor:pointer}
.agree input{width:24px;height:24px;accent-color:var(--accent)}
.sigpad{display:block;width:100%;height:170px;background:#fff;border:2px dashed color-mix(in srgb,var(--ink) 25%,transparent);border-radius:18px;touch-action:none;cursor:crosshair}
.sigimg{display:block;max-width:300px;width:100%;background:#fff;border-radius:12px;margin:6px 0;border:2px solid var(--edge)}
/* try-on */
.tryon{position:relative;aspect-ratio:1;border-radius:24px;overflow:hidden;background:var(--surface-2);border:2px solid var(--edge);touch-action:none}
.tryon img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tryov{position:absolute;cursor:grab;touch-action:none}
.tryov svg{display:block;width:100%;height:auto;overflow:visible}
.tryempty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-align:center;color:var(--ink-2);font-weight:700}
.tryempty input{position:absolute;inset:0;opacity:0;cursor:pointer}
@media print{
  body{background:#fff!important;padding:0!important;color:#000}
  body::before{display:none}
  .top,.tabbar,.wiz-foot,.noprint,.toast{display:none!important}
  .card{box-shadow:none!important;border:0!important}
  .view,.rise{animation:none!important}
  .consent-text{max-height:none;background:none;padding:0;border:0}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<script>
'use strict';
/* ---------- helpers ---------- */

let tryState = null, tryDrag = null;
function tryOnSVG(zones, real) {
  const g = mapGeometry(zones, 12);
  return `<svg viewBox="0 0 ${MAP_W} ${MAP_H}" aria-hidden="true">${g.lashes.map(l => `<path d="M${l.s.x.toFixed(1)},${l.s.y.toFixed(1)} Q${l.c.x.toFixed(1)},${l.c.y.toFixed(1)} ${l.e.x.toFixed(1)},${l.e.y.toFixed(1)}" stroke="${real ? '#1a1113' : CURL_COLOR[l.curl]}" stroke-width="${real ? 1.3 : 1.7}" stroke-linecap="round" fill="none" opacity="${real ? .85 : 1}"/>`).join('')}
    <path d="M${g.P0.x},${g.P0.y} Q${g.P1.x},${g.P1.y} ${g.P2.x},${g.P2.y}" fill="none" stroke="#fff" stroke-width="1.6" stroke-dasharray="5 5" opacity=".95"/></svg>`;
}
async function tryOnSheet() {
  const before = (draft.photos || []).find(p => p.kind === 'before');
  tryState = { photoId: null, x: .5, y: .5, size: .8, rot: 0, flip: false, real: true };
  openSheet('Preview on her eye', `
    <div class="tryon" id="tryStage"><img id="tryImg" alt="Her eye" hidden><div class="tryov" id="tryOv" hidden></div>
      <label class="tryempty" id="tryEmpty">${icon('camera', 30)}<b>Take a photo of her eye</b><span class="small muted">Straight on, eye open, good light</span><input type="file" accept="image/*" capture="environment" data-try-file></label></div>

    <div class="field"><span>Size</span><div class="range"><input type="range" id="trySize" min="30" max="160" value="80" style="--v:56%"></div></div>
    <div class="field"><span>Tilt</span><div class="range"><input type="range" id="tryRot" min="-35" max="35" value="0" style="--v:50%"></div></div>
    <div class="chips"><button class="chip" data-act="tryFlip" aria-pressed="false">Mirror for other eye</button><button class="chip" data-act="tryReal" aria-pressed="true">Realistic lashes</button><label class="chip" style="position:relative;display:inline-flex;align-items:center;gap:6px">${icon('camera', 14)} New photo<input type="file" accept="image/*" capture="environment" data-try-file style="position:absolute;inset:0;opacity:0"></label></div>
    <button class="btn primary block lg press" data-act="trySave" style="margin-top:14px">${icon('sparkle', 18)} Save preview to this visit</button>`);
  const pct = (el, lo, hi) => el.style.setProperty('--v', ((el.value - lo) / (hi - lo) * 100) + '%');
  $('#trySize').oninput = e => { tryState.size = e.target.value / 100; pct(e.target, 30, 160); paintTry(true); };
  $('#tryRot').oninput = e => { tryState.rot = +e.target.value; pct(e.target, -35, 35); paintTry(true); };

async function loadTryPhoto(id) {
  const u = await photoURL(id); if (!u || !$('#tryImg')) return;
  tryState.photoId = id; const img = $('#tryImg'); img.src = u; img.hidden = false; $('#tryEmpty').hidden = true; $('#tryOv').hidden = false; paintTry();
}
function paintTry(styleOnly) {
  const ov = $('#tryOv'), t = tryState; if (!ov || !t) return;
  ov.style.left = t.x * 100 + '%'; ov.style.top = t.y * 100 + '%'; ov.style.width = t.size * 100 + '%';
  ov.style.transform = `translate(-50%,-50%) rotate(${t.rot}deg) scaleX(${t.flip ? -1 : 1})`;
  if (!styleOnly) ov.innerHTML = tryOnSVG(draft.zones, t.real);
}
function renderTry() {
  const N = 1080, cv = document.createElement('canvas'), x = cv.getContext('2d'), img = $('#tryImg'), t = tryState;
  cv.width = cv.height = N;
  const s = Math.max(N / img.naturalWidth, N / img.naturalHeight);
  x.drawImage(img, (N - img.naturalWidth * s) / 2, (N - img.naturalHeight * s) / 2, img.naturalWidth * s, img.naturalHeight * s);
  const g = mapGeometry(draft.zones, 12), k = t.size * N / MAP_W;
  x.save(); x.translate(t.x * N, t.y * N); x.rotate(t.rot * Math.PI / 180); x.scale(t.flip ? -1 : 1, 1); x.scale(k, k); x.translate(-MAP_W / 2, -MAP_H / 2);
  x.lineCap = 'round';
  for (const l of g.lashes) { x.strokeStyle = t.real ? 'rgba(26,17,19,.85)' : CURL_COLOR[l.curl]; x.lineWidth = t.real ? 1.3 : 1.7; x.beginPath(); x.moveTo(l.s.x, l.s.y); x.quadraticCurveTo(l.c.x, l.c.y, l.e.x, l.e.y); x.stroke(); }
  x.restore();
  const label = `${draft.style} · ${mapSummary(draft).curls} curl · ${mapSummary(draft).range}`;
  x.font = '600 30px "Inter", system-ui, sans-serif'; const w = x.measureText(label).width + 40;
  x.fillStyle = 'rgba(20,12,15,.55)'; roundRect(x, 30, N - 84, w, 54, 27); x.fill(); x.fillStyle = '#fff'; x.fillText(label, 50, N - 47);
  return new Promise(r => cv.toBlob(r, 'image/jpeg', .88));
}
document.addEventListener('pointerdown', e => {
  if (!e.target.closest('#tryOv') || !tryState) return;
  const r = $('#tryStage').getBoundingClientRect();
  tryDrag = { sx: e.clientX, sy: e.clientY, x: tryState.x, y: tryState.y, w: r.width }; e.preventDefault();
});
window.addEventListener('pointermove', e => {
  if (!tryDrag) return;
  tryState.x = Math.min(1, Math.max(0, tryDrag.x + (e.clientX - tryDrag.sx) / tryDrag.w));
  tryState.y = Math.min(1, Math.max(0, tryDrag.y + (e.clientY - tryDrag.sy) / tryDrag.w));
  paintTry(true);
});
window.addEventListener('pointerup', () => { tryDrag = null; });

  bindSettingsInputs($('#dlg'));
}

/* ---------- data import/export ---------- */
async function exportData() {
  const photos = {};
  try { for (const k of await idb.keys()) { const b = await idb.get(k); photos[k] = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); }); } } catch {}
  db.settings.lastBackup = todayISO(); save();
  downloadBlob(new Blob([JSON.stringify({ app: 'fillcard', version: 1, exportedAt: new Date().toISOString(), db, photos })], { type: 'application/json' }), `fillcard-backup-${todayISO()}.json`);
  toast('Backup downloaded');
}
async function importData(file) {
  if (!file) return;
  try {
    const d = JSON.parse(await file.text()); if (d.app !== 'fillcard' || !d.db?.clients) throw 0;
    if (!confirm(`Replace everything on this phone with the backup (${d.db.clients.length} clients)?`)) return;
    db = d.db; db.settings = { ...DEFAULT_SETTINGS, ...db.settings }; save();
    await idb.clear(); for (const [k, u] of Object.entries(d.photos || {})) await idb.put(k, await (await fetch(u)).blob());
    urlCache.clear(); applyBrand(); toast('Backup restored'); location.hash = '#/';
  } catch { toast('That file isn’t a Fillcard backup', false); }
}

/* ---------- actions ---------- */
function markReminded(id) { const c = getClient(id); if (c) { c.lastReminded = todayISO(); save(); } }
async function act(name, el) {
  const v = draft;
  switch (name) {
    case 'closeDlg': closeSheet(); break;
    case 'dismissOnboard': db.settings.onboarded = true; save(); route(); break;
    case 'setup': setupSheet(); break;
    case 'finishSetup':
      $$('#dlg input[type=text][data-s], #dlg input[type=url][data-s], #dlg input[type=tel][data-s]').forEach(i => { db.settings[i.dataset.s] = i.dataset.s === 'instagram' ? i.value.replace(/^@/, '').trim() : i.value.trim(); });
      db.settings.onboarded = true; save(); closeSheet(); burst(el); toast('Studio ready'); setTimeout(route, 250); break;
    case 'color': db.settings.color = el.dataset.v; save(); applyBrand(); $$('.sw[data-v]', el.closest('.swatches')).forEach(b => b.setAttribute('aria-pressed', b === el)); haptic(); break;
    case 'refillDefault': db.settings.refillDays = +el.dataset.v; save(); $$('[data-act="refillDefault"]').forEach(b => b.setAttribute('aria-pressed', b === el)); break;
    case 'install': if (installEvt) { installEvt.prompt(); installEvt = null; } break;
    case 'filter': clientFilter = el.dataset.v; viewClients($('#q')?.value || ''); break;
    case 'newClient': clientForm(); break;
    case 'editClient': clientForm(getClient(el.dataset.id)); break;
    case 'deleteClient': {
      const c = getClient(el.dataset.id); if (!confirm(`Delete ${c.name} and all her visits? This can’t be undone.`)) return;
      for (const x of visitsOf(c.id)) for (const p of x.photos || []) idb.del(p.id).catch(() => {});
      db.visits = db.visits.filter(x => x.clientId !== c.id); db.clients = db.clients.filter(x => x.id !== c.id); save(); toast('Client deleted'); location.hash = '#/clients'; break;
    }
    case 'quickClient': {
      const n = $('#quickName').value.trim(); if (!n) { $('#quickName').focus(); return; }
      const c = { id: uid(), name: n, phone: '', instagram: '', allergies: '', patchTest: '', notes: '', createdAt: todayISO() }; db.clients.push(c); save(); location.hash = '#/consent/' + c.id + '/visit'; break;
    }
    case 'remind': queue = null; remindSheet(el.dataset.id); break;
    case 'queue': {
      const ids = db.clients.filter(c => ['overdue', 'lapsed'].includes(clientStatus(c).kind) && !remindedToday(c)).map(c => c.id);
      if (!ids.length) return; queue = { ids, idx: 0 }; remindSheet(ids[0], queue); break;
    }
    case 'qNext': {
      if (!queue) return closeSheet();
      if (!el.dataset.skip) markReminded(queue.ids[queue.idx]);
      queue.idx++;
      if (queue.idx >= queue.ids.length) { queue = null; closeSheet(); toast('Reminders done'); route(); } else remindSheet(queue.ids[queue.idx], queue);
      break;
    }
    case 'markReminded': markReminded(el.dataset.id); break;
    case 'copyRemind': markReminded(el.dataset.id); copyText($('#rmsg').value, 'Copied — paste it in her DMs'); break;
    case 'goStep': { const n = +el.dataset.i; if (n === step) return; renderStep(n, n > step ? 'fwd' : 'back'); haptic(); break; }
    case 'zone': sel = +el.dataset.i; haptic(); paintZones(false); break;
    case 'len': v.zones[sel].len = clampLen(v.zones[sel].len + +el.dataset.d); dirty = true; haptic(); paintZones(); break;
    case 'curl': v.zones[sel].curl = el.dataset.v; v.curl = el.dataset.v; dirty = true; haptic(); paintZones(false); break;
    case 'curlAll': v.zones.forEach(z => z.curl = v.zones[sel].curl); dirty = true; paintZones(false); toast(`${v.zones[sel].curl} curl on every zone`); break;
    case 'allLen': v.zones.forEach(z => z.len = clampLen(z.len + +el.dataset.d)); dirty = true; paintZones(); break;
    case 'zonesN': { const n = Math.max(4, Math.min(10, v.zones.length + +el.dataset.d)); v.zones = resizeZones(v.zones, n); sel = Math.min(sel, n - 1); dirty = true; paintZones(false); break; }
    case 'preset': {
      const curls = v.zones.map(z => z.curl); v.style = el.dataset.v;
      v.zones = presetLengths(v.style, v.zones.length).map((len, i) => ({ len, curl: curls[i] || v.curl })); dirty = true; haptic();
      $$('[data-act="preset"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v.style)); paintZones(); break;
    }
    case 'set': {
      const k = el.dataset.k, val = k === 'refillDays' ? +el.dataset.v : el.dataset.v; v[k] = val; dirty = true; haptic();
      if (k === 'service') { renderStep(step, ''); break; }
      $$(`[data-act="set"][data-k="${k}"]`).forEach(b => b.setAttribute('aria-pressed', b.dataset.v === String(val)));
      if (k === 'refillDays') paintDue();
      break;
    }
    case 'saveVisit': {
      v.nextDue = addDays(v.date, v.refillDays || S().refillDays); v.price = v.price === '' ? '' : Number(v.price);
      delete v.prefilledFrom; delete v._new; const i = db.visits.findIndex(x => x.id === v.id);
      if (i >= 0) db.visits[i] = v; else db.visits.push(v);
      save(); dirty = false; burst(el); haptic(20); toast('Visit saved');
      setTimeout(() => { location.hash = '#/card/' + v.id; }, reduced ? 0 : 420); break;
    }
    case 'deleteVisit': {
      if (!confirm('Delete this visit?')) return;
      for (const p of v.photos || []) idb.del(p.id).catch(() => {});
      db.visits = db.visits.filter(x => x.id !== v.id); save(); dirty = false; toast('Visit deleted'); location.hash = '#/client/' + v.clientId; break;
    }
    case 'shareCard': {
      const img = $('#cardImg'), b = img?._blob; if (!b) return toast('Card is still rendering…', false);
      const vv = getVisit(location.hash.split('/')[2]), c = getClient(vv.clientId), fname = `${firstName(c.name).toLowerCase()}-lash-card.png`;
      const file = new File([b], fname, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: 'Your lash refill card' }); } catch {} }
      else { downloadBlob(b, fname); toast('Card downloaded'); }
      break;
    }
    case 'copyLink': copyText(passportLink(getVisit(location.hash.split('/')[2])), 'Passport link copied'); break;
    case 'copyMsg': { const vv = getVisit(location.hash.split('/')[2]); copyText(fill(S().passportMsg, getClient(vv.clientId), { link: passportLink(vv) }), 'Message copied — paste it in her DMs'); break; }
    case 'ics': { downloadBlob(new Blob([icsFor(app._passport)], { type: 'text/calendar' }), 'lash-refill.ics'); toast('Reminder added — check your calendar'); break; }
    case 'ck': {
      const i = el.dataset.i, on = !el.classList.contains('on'); el.classList.toggle('on', on); haptic();
      app._checks[i] = on; try { localStorage.setItem(app._ckKey, JSON.stringify(app._checks)); } catch {}
      break;
    }
    case 'bookingMode': {
      db.settings.bookingMode = el.dataset.v; save(); haptic();
      const box = el.closest('#bookBox'); box.innerHTML = bookingFieldsHTML(box.closest('dialog') ? { ...S(), booking: S().booking.includes('example.com') ? '' : S().booking } : S()); bindSettingsInputs(box); break;
    }
    case 'apptDue': draft.nextAppt = { date: addDays(draft.date, draft.refillDays), time: draft.nextAppt?.time || '' }; dirty = true; renderStep(2, ''); break;
    case 'apptClear': draft.nextAppt = null; dirty = true; renderStep(2, ''); break;
    case 'tryOn': tryOnSheet(); break;
    case 'tryFlip': tryState.flip = !tryState.flip; el.setAttribute('aria-pressed', tryState.flip); paintTry(true); haptic(); break;
    case 'tryReal': tryState.real = !tryState.real; el.setAttribute('aria-pressed', tryState.real); paintTry(); haptic(); break;
    case 'trySave': {
      if (!tryState?.photoId) return toast('Take a photo of her eye first', false);
      const blob = await renderTry(), id = 'ph_' + uid(); await idb.put(id, blob);
      const old = (draft.photos || []).find(p => p.kind === 'preview'); if (old) idb.del(old.id).catch(() => {});
      draft.photos = [...(draft.photos || []).filter(p => p.kind !== 'preview'), { id, kind: 'preview' }]; dirty = true;
      burst(el); haptic(20); closeSheet(); toast('Preview saved to this visit'); break;
    }
    case 'eyeGuide': eyeGuideSheet(); break;
    case 'eyePick': { const c = getClient(draft.clientId); c.eyeShape = el.dataset.v; save(); haptic(); eyeGuideSheet(el.dataset.v); break; }
    case 'eyeApply': {
      const cu = el.dataset.curl; draft.style = el.dataset.style; draft.curl = cu;
      draft.zones = presetLengths(draft.style, draft.zones.length).map(len => ({ len, curl: cu })); dirty = true;
      closeSheet(); $$('[data-act="preset"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === draft.style)); paintZones(); toast(`${draft.style} · ${cu} curl applied`); break;
    }
    case 'cq': {
      consentDraft.answers[el.dataset.k] = el.dataset.v; haptic();
      $$(`[data-act="cq"][data-k="${el.dataset.k}"]`).forEach(b => b.setAttribute('aria-pressed', b === el));
      $('#cqDetails').hidden = !Object.values(consentDraft.answers).includes('Yes'); updateConsentBtn(); break;
    }
    case 'sigClear': $('#sig')?.clearSig?.(); break;
    case 'consentSave': {
      const c = getClient(location.hash.split('/')[2]), cv = $('#sig');
      if (!c || !cv?.signed || !$('#agree').checked) return;
      const blob = await new Promise(r => cv.toBlob(r, 'image/png')), sigId = 'sig_' + uid(); await idb.put(sigId, blob);
      if (c.consent?.sigId) idb.del(c.consent.sigId).catch(() => {});
      c.consent = { date: todayISO(), answers: { ...consentDraft.answers }, details: consentDraft.details.trim(), text: S().consentText, printed: $('#printed').value.trim() || c.name, sigId };
      if (c.consent.answers.allergy === 'Yes' && c.consent.details && !c.allergies) c.allergies = c.consent.details;
      save(); burst(el); haptic(20); toast('Consent signed & saved');
      const next = el.dataset.next === 'visit' ? '#/visit/new/' + c.id : '#/consent/' + c.id;
      setTimeout(() => { location.hash = next; }, reduced ? 0 : 420); break;
    }
    case 'print': window.print(); break;
    case 'exportData': exportData(); break;
    case 'clearDemo': {
      if (!confirm('Remove the demo clients?')) return;
      const ids = new Set(db.clients.filter(c => c.demo).map(c => c.id));
      db.clients = db.clients.filter(c => !ids.has(c.id)); db.visits = db.visits.filter(x => !ids.has(x.clientId));
      if (db.settings.studio === 'Jess Lash Studio') Object.assign(db.settings, { artist: '', studio: '', booking: '', instagram: '' });
      save(); viewSettings(); toast('Demo data removed'); break;
    }
    case 'wipe': if (confirm('Erase all clients, visits and photos on this phone?') && confirm('Really erase everything? Export a backup first if unsure.')) { localStorage.removeItem(KEY); await idb.clear().catch(() => {}); db = { settings: { ...DEFAULT_SETTINGS }, clients: [], visits: [] }; save(); location.hash = '#/'; route(); } break;
  }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'BUTTON' || el.tagName === 'LI') e.preventDefault();
  act(el.dataset.act, el);
});
document.addEventListener('input', e => {
  const k = e.target.dataset?.k; if (!k || !draft) return;
  draft[k] = e.target.value; dirty = true;
  if (k === 'date') paintDue();
});
document.addEventListener('change', async e => {
  if (e.target.matches?.('[data-try-file]') && e.target.files[0] && draft) {
    try {
      const blob = await compress(e.target.files[0]), id = 'ph_' + uid(); await idb.put(id, blob);
      // The eye photo doubles as her "before" photo when she doesn't have one yet.
      if (!(draft.photos || []).some(p => p.kind === 'before')) { draft.photos = [...(draft.photos || []), { id, kind: 'before' }]; dirty = true; }
      await loadTryPhoto(id); haptic();
    } catch { toast('Couldn’t read that photo', false); }
    return;
  }
  const kind = e.target.dataset?.photoKind; if (!kind || !draft || !e.target.files[0]) return;
  try {
    const blob = await compress(e.target.files[0]), id = 'ph_' + uid(); await idb.put(id, blob);
    const old = (draft.photos || []).find(p => p.kind === kind); if (old) idb.del(old.id).catch(() => {});
    draft.photos = [...(draft.photos || []).filter(p => p.kind !== kind), { id, kind }]; dirty = true;
    const box = e.target.closest('.photo'); box.querySelector('.ph')?.remove(); box.querySelector('img')?.remove();
    const img = document.createElement('img'); img.alt = kind + ' photo'; img.src = await photoURL(id); box.prepend(img); haptic();
  } catch { toast('Couldn’t read that photo', false); }
});

/* ---------- routing & boot ---------- */
let lastHash = location.hash;
function route() {
  const h = location.hash.slice(1) || '/';
  window.scrollTo(0, 0);
  if (h.startsWith('p=')) return viewPassport(h.slice(2));
  document.body.classList.remove('client-mode'); app.className = 'wrap'; applyBrand();
  const [, view, a, b] = h.split('/');
  if (!view) return viewHome();
  if (view === 'clients') return viewClients();
  if (view === 'client') return viewClient(a);
  if (view === 'visit') return a === 'new' ? (b ? viewEditor('new', b) : viewPickClient()) : viewEditor(a);
  if (view === 'card') return viewCard(a);
  if (view === 'settings') return viewSettings();
  if (view === 'consent') return viewConsent(a, b);
  notFound();
}
window.addEventListener('hashchange', () => {
  if (dirty && lastHash.includes('/visit/') && !confirm('Leave without saving this visit?')) { history.replaceState(null, '', lastHash); return; }
  dirty = false; lastHash = location.hash; if ($('#dlg').open) $('#dlg').close(); route();
});
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
function applyBrand() {
  const col = S().color; if (col) document.documentElement.style.setProperty('--accent', col);
  const th = S().theme; if (th === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', th);
  const b = $('.brand'); if (b && b.dataset.col !== col) { b.dataset.col = col; b.innerHTML = mascot({ size: 36 }) + 'Fillcard'; }
}
$('#themeBtn').onclick = () => {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches, cur = S().theme;
  db.settings.theme = (cur === 'dark' || (cur === 'auto' && dark)) ? 'light' : 'dark'; save(); applyBrand(); haptic();
};
if (!localStorage.getItem(KEY)) save();
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
route();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
